<!DOCTYPE html>
<!-- KinoLel für Windows: Dialoge im KinoLel-Design (Update, Was ist neu, Grafik-Info) – wie in den anderen Apps:
     dunkle Karte #1b1d2a, Rand rgba(255,255,255,.08), Ecken 18 px, Hauptknopf Lavendel #9aa4ff mit dunkler Schrift. -->
<html lang="de"><head><meta charset="utf-8"><title>KinoLel</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; height: 100%; background: rgba(5, 7, 13, .62); overflow: hidden;
               font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #e8eaf6; }
  body { display: flex; align-items: center; justify-content: center; }
  .karte { background: #1b1d2a; border: 1px solid rgba(255, 255, 255, .08); border-radius: 18px; padding: 26px 28px 22px;
           width: min(520px, calc(100vw - 48px)); max-height: calc(100vh - 64px); overflow: auto; box-sizing: border-box;
           box-shadow: 0 18px 60px rgba(0, 0, 0, .55); }
  h1 { margin: 0 0 12px; font-size: 20px; font-weight: 650; }
  ul { margin: 0 0 6px; padding-left: 20px; }
  li { margin: 0 0 7px; }
  p { margin: 0 0 10px; white-space: pre-wrap; }
  pre { margin: 0 0 10px; font: 12px/1.45 Consolas, monospace; color: #c9cce0; white-space: pre-wrap; user-select: text; }
  .fortschritt { height: 6px; border-radius: 3px; background: rgba(154, 164, 255, .18); overflow: hidden; margin: 6px 0 12px; display: none; }
  .fortschritt div { height: 100%; width: 0; background: #9aa4ff; transition: width .2s; }
  .knoepfe { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  button { font: inherit; font-weight: 600; border-radius: 999px; padding: 9px 20px; border: 1px solid rgba(255, 255, 255, .14);
           background: transparent; color: #e8eaf6; cursor: pointer; }
  button.haupt { background: #9aa4ff; color: #0b0f18; border-color: #9aa4ff; }
  button:focus-visible { outline: 3px solid #9aa4ff; outline-offset: 2px; }
  button:hover { filter: brightness(1.08); }
</style></head>
<body>
  <div class="karte" role="dialog" aria-modal="true" aria-labelledby="titel">
    <h1 id="titel"></h1>
    <div id="inhalt"></div>
    <div class="fortschritt" id="fortschritt"><div></div></div>
    <div class="knoepfe" id="knoepfe"></div>
  </div>
  <script src="dialog.js"></script>
</body></html>
