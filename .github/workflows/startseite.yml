# KinoLel-Player: Startseiten-Test (Lel 17.10.: „Es flackert konstant auf dem Startbildschirm …“)
#
# Startet die veröffentlichte KinoLel-Version (Portable) auf einem Windows-Runner ohne GPU (wie Lels VM 123), meldet sich
# mit dem Hilfskonto an (Passwort = Secret KINOLEL_TEST_PW, wird nie ausgegeben) und beobachtet die Startseite:
# Video, Netzwerk-Anfragen/s, DOM-Mutationen/s, Neuaufbau der Abschnitte, Neuladen; dazu Chrome als Vergleich.
# Ergebnis: Zusammenfassung des Laufs + Artefakt "startseite" (wird nach der Auswertung gelöscht).
# Der volle Build (windows.yml) führt denselben Test mit der frisch gebauten App aus.
name: startseite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - bundle/test/startseite.py
      - .github/workflows/startseite.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7
    - name: Bildschirm 1920x1080 (wenn möglich)
      continue-on-error: true
      run: |
        Set-DisplayResolution -Width 1920 -Height 1080 -Force
        Add-Type -AssemblyName System.Windows.Forms
        [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      shell: powershell
    - name: Neueste KinoLel-Version holen (Portable)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName'
        Write-Host "Version: $tag"
        gh release download $tag --repo "${{ github.repository }}" --pattern "*-Portable-*-x64.zip" --dir zip
        Expand-Archive (Get-ChildItem zip -Filter *.zip | Select-Object -First 1).FullName -DestinationPath app-roh
        $exe = Get-ChildItem app-roh -Recurse -Filter KinoLel.exe | Select-Object -First 1
        Move-Item $exe.DirectoryName app
        Get-ChildItem app | Select-Object -First 5
      shell: pwsh
    - name: Startseiten-Test
      timeout-minutes: 30
      env:
        KINOLEL_TEST_PW: ${{ secrets.KINOLEL_TEST_PW }}
      run: |
        python -m pip install --quiet psutil websocket-client imageio-ffmpeg
        python bundle/test/startseite.py app startseite
      shell: pwsh
    - name: Ergebnis sichern
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: startseite
        path: ${{ github.workspace }}/startseite/
        retention-days: 3
        if-no-files-found: ignore
